<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Matchnight — your match nights with friends: results, Elo ratings, tables and rivalries."
    />
    <meta name="theme-color" content="#06080d" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Matchnight" />
    <!-- the preview when a link is shared (WhatsApp, Telegram…); the friends it goes to read Turkish -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Matchnight" />
    <meta property="og:title" content="Matchnight — maç geceleri" />
    <meta property="og:description" content="Arkadaşlarınla maç geceleri: skorlar, Elo, puan durumu ve rekabetler." />
    <meta property="og:url" content="https://matchnight.hotspotkeeper.com/" />
    <meta property="og:image" content="https://matchnight.hotspotkeeper.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Matchnight</title>
    <!-- the edition (src/lib/edition.ts): nginx answers it from the server's EDITION, before the app starts -->
    <script src="/edition.js"></script>
    <script>
      try {
        var t = localStorage.getItem("fm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // the interface size this device tries (src/hooks/useUiScale.ts), before anything is drawn
        var s = { xs: 0.8125, s: 0.875, l: 1.125 }[localStorage.getItem("matchnight.uiScale")];
        if (s) document.documentElement.style.fontSize = s * 100 + "%";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
