<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="FIFA Manager — match center, Elo ratings, leaderboards and rivalries for our FIFA nights."
    />
    <meta name="theme-color" content="#06080d" />
    <link rel="icon" type="image/svg+xml" href="/football.svg" />
    <title>FIFA Manager</title>
    <script>
      try {
        var t = localStorage.getItem("fm-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
