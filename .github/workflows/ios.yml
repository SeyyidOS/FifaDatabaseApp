# The iPhone app (frontend/capacitor.config.ts, frontend/ios; frontend/ios/README.md): the web app built
# as the store edition, in its native shell, built on a Mac.
#   simulator   every change under frontend/: does the app still build (unsigned)?
#   testflight  main and by hand, once the App Store Connect secrets exist: signs it and sends it to
#               TestFlight. Without them it is skipped, with a notice; the gate runs on Linux, so no Mac
#               minutes are spent waiting for secrets.
name: iOS

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ios
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # App Store Connect takes only apps built with the newest iOS SDK (Xcode 26 and later)
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # the web app as the store edition, copied into the shell with its native plugins
      - run: npm run build:app
      - run: npx cap sync ios
      - name: Build for the simulator, unsigned
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - uses: actions/upload-artifact@v4
        with:
          name: Matchnight-simulator
          path: frontend/build/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7

  gate:
    name: testflight gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice::TestFlight skipped: the repository has no secret$missing (frontend/ios/README.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  testflight:
    name: testflight
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build:app
      - run: npx cap sync ios
      # One place each: the bundle id is appId in capacitor.config.ts, the version is package.json's, the
      # build number this run's. They go into the App target's own settings, not onto xcodebuild's command
      # line, where they'd reach the Capacitor frameworks too and break their signatures.
      - name: The app's id, version, build number and team
        run: |
          python3 - <<'PY'
          import json, os, re
          app_id = json.load(open("ios/App/App/capacitor.config.json"))["appId"]
          version = json.load(open("package.json"))["version"]
          path = "ios/App/App.xcodeproj/project.pbxproj"
          text = open(path).read()
          text = re.sub(r"PRODUCT_BUNDLE_IDENTIFIER = [^;]+;", f"PRODUCT_BUNDLE_IDENTIFIER = {app_id};", text)
          text = re.sub(r"MARKETING_VERSION = [^;]+;", f"MARKETING_VERSION = {version};", text)
          text = re.sub(r"CURRENT_PROJECT_VERSION = [^;]+;", f"CURRENT_PROJECT_VERSION = {os.environ['GITHUB_RUN_NUMBER']};", text)
          text = re.sub(r"(\t+)CODE_SIGN_STYLE = Automatic;", lambda m: f"{m.group(0)}\n{m.group(1)}DEVELOPMENT_TEAM = {os.environ['APPLE_TEAM_ID']};", text)
          open(path, "w").write(text)
          print(f"{app_id} {version} ({os.environ['GITHUB_RUN_NUMBER']})")
          PY
          xcodebuild -version
      # The .p8 file as Xcode wants it, from however the secret was pasted: with or without its BEGIN and
      # END lines, on one line, with Windows line ends, or the whole file base64'd. Says what's wrong with
      # it, never what it is.
      - name: The API key, where Xcode looks for it
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          python3 - ~/private_keys/"AuthKey_$ASC_KEY_ID.p8" <<'PY'
          import base64, binascii, os, re, sys, textwrap

          def body_of(text):
              text = text.replace("\r", "").replace("\\n", "\n").strip().strip('"').strip("'")
              found = re.search(r"-----BEGIN [A-Z ]*PRIVATE KEY-----(.*?)-----END [A-Z ]*PRIVATE KEY-----", text, re.S)
              return re.sub(r"[^A-Za-z0-9+/=]", "", found.group(1) if found else text), bool(found)

          raw = os.environ["ASC_KEY_P8"]
          body, marked = body_of(raw)
          try:
              der = base64.b64decode(body, validate=True)
          except binascii.Error:
              der = b""
          if not marked and b"PRIVATE KEY" in der:  # the whole file, base64'd
              body, marked = body_of(der.decode())
              der = base64.b64decode(body)
          # an App Store Connect key is a P-256 key in PKCS#8: DER starting with a SEQUENCE, ~138 bytes
          if not der.startswith(b"\x30") or not 100 <= len(der) <= 200:
              print(f"::error::ASC_KEY_P8 isn't the .p8 file: {len(raw)} characters, {raw.count(chr(10)) + 1} lines, "
                    f"BEGIN/END lines {'found' if marked else 'missing'}, {len(der)} bytes once decoded. "
                    "Paste the whole AuthKey_….p8 file, from -----BEGIN PRIVATE KEY----- to -----END PRIVATE KEY-----.")
              sys.exit(1)
          with open(sys.argv[1], "w") as f:
              f.write("-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n")
          print(f"key file written ({len(der)} bytes)")
          PY
          chmod 600 ~/private_keys/"AuthKey_$ASC_KEY_ID.p8"
      - name: Archive, signed by the App Store Connect key
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/"AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -60 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E "Signing Identity|Provisioning Profile|warning: |error: |ARCHIVE" "$RUNNER_TEMP/archive.log" | sort -u | head -40
      - name: Export for App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/"AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      # what the IPA is really signed with, before App Store Connect is asked
      - name: Check the signature
        run: |
          cd "$RUNNER_TEMP" && rm -rf ipa && mkdir ipa && unzip -q export/*.ipa -d ipa
          for f in ipa/Payload/App.app ipa/Payload/App.app/Frameworks/Capacitor.framework; do
            echo "== $f"
            codesign -dvv "$f" 2>&1 | grep -E "^(Identifier|Authority|TeamIdentifier|Signature|Format)" || true
          done
          if ! codesign --verify --deep --strict --verbose=2 ipa/Payload/App.app; then
            # Apple's own bug: a certificate name with a letter outside ASCII (the "İ" of a Turkish name,
            # say) is written into the signature in another Unicode form, so it never matches
            echo "::error::The signature doesn't satisfy its own designated requirement. If the Apple Distribution name above has a letter outside ASCII, Apple Developer Programs must rename the team (frontend/ios/README.md, 'Known problems')."
            exit 1
          fi
      - name: Upload to TestFlight
        run: xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Forget the key
        if: always()
        run: rm -rf ~/private_keys
