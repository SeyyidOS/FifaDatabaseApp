# The iPhone app (frontend/capacitor.config.ts, frontend/ios): the web app built as the store edition, in
# its native shell, built on a Mac. For now it checks that the app builds (for the simulator, unsigned);
# signing and TestFlight come once the App Store Connect key is in the repository's secrets.
name: iOS

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/ios.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ios
    runs-on: macos-15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # the web app as the store edition, copied into the shell with its native plugins
      - run: npm run build:app
      - run: npx cap sync ios
      - name: Build for the simulator, unsigned
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - uses: actions/upload-artifact@v4
        with:
          name: Matchnight-simulator
          path: frontend/build/Build/Products/Release-iphonesimulator/App.app
          retention-days: 7
