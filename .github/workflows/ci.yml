# Runs on every pull request and on main. The server publishes a commit of main only after both jobs
# pass (deploy/auto-deploy.sh), and branch protection keeps failing pull requests out of main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fifa
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: fifa_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fifa -d fifa_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # the tests refuse any database whose name doesn't end in _test
      DATABASE_URL: postgresql://fifa:testpw@localhost:5432/fifa_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npx eslint src
      - run: npx vitest run
      - run: npx vite build --base=/
